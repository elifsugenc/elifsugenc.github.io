<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <pattern id="feGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#eceae4" stroke-width="0.6"/>
    </pattern>
    <pattern id="feHatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#991b1b" stroke-width="0.7" opacity="0.35" />
    </pattern>
    <marker id="feArrowInk" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M 0 0 L 6 3 L 0 6 z" fill="#991b1b" />
    </marker>
    <marker id="feArrowGraphite" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M 0 0 L 6 3 L 0 6 z" fill="#52525b" />
    </marker>
  </defs>

  <!-- Drafting Paper Base -->
  <rect width="600" height="400" fill="#faf9f6" />
  <rect width="600" height="400" fill="url(#feGrid)" />

  <!-- Frame & Registration Marks -->
  <rect x="16" y="16" width="568" height="368" fill="none" stroke="#d4d2cb" stroke-width="0.8" />
  <path d="M 16 28 L 16 16 L 28 16 M 584 28 L 584 16 L 572 16 M 16 372 L 16 384 L 28 384 M 584 372 L 584 384 L 572 384" fill="none" stroke="#71717a" stroke-width="1" />

  <!-- Drafting Header (centered inside 1:1 square safe zone x=116..484) -->
  <text x="116" y="34" font-family="monospace" font-size="8.5" font-weight="600" fill="#991b1b" letter-spacing="1.2">FIG. 12 &#8226; AGENT EGRESS PLAN</text>
  <text x="484" y="34" font-family="monospace" font-size="8.5" font-weight="600" fill="#71717a" text-anchor="end" letter-spacing="1">MEF &#8226; WIP</text>

  <!-- Plan Enclosure Walls (Section Cut) -->
  <rect x="70" y="60" width="460" height="276" fill="#ffffff" stroke="#111111" stroke-width="2" />
  <line x1="70" y1="150" x2="260" y2="150" stroke="#111111" stroke-width="1.6" />
  <line x1="310" y1="150" x2="530" y2="150" stroke="#111111" stroke-width="1.6" />
  <line x1="260" y1="60" x2="260" y2="150" stroke="#111111" stroke-width="1.6" />
  <line x1="410" y1="60" x2="410" y2="150" stroke="#111111" stroke-width="1.6" />

  <line x1="70" y1="240" x2="220" y2="240" stroke="#111111" stroke-width="1.6" />
  <line x1="280" y1="240" x2="430" y2="240" stroke="#111111" stroke-width="1.6" />
  <line x1="220" y1="240" x2="220" y2="336" stroke="#111111" stroke-width="1.6" />
  <line x1="370" y1="240" x2="370" y2="336" stroke="#111111" stroke-width="1.6" />

  <!-- Door Swing Arcs / Threshold Circles -->
  <circle cx="285" cy="150" r="14" fill="none" stroke="#991b1b" stroke-width="0.8" stroke-dasharray="2 2" />
  <circle cx="250" cy="240" r="14" fill="none" stroke="#991b1b" stroke-width="0.8" stroke-dasharray="2 2" />

  <!-- Bottleneck Hatched Architectural Zone -->
  <rect x="420" y="160" width="105" height="74" fill="url(#feHatch)" stroke="#991b1b" stroke-width="1" stroke-dasharray="3 2" />
  <text x="452" y="182" font-family="monospace" font-size="7.5" font-weight="700" fill="#7f1d1d" text-anchor="middle" letter-spacing="0.8">BOTTLENECK</text>
  <text x="452" y="196" font-family="monospace" font-size="7" fill="#991b1b" text-anchor="middle">THRESHOLD</text>
  <text x="452" y="210" font-family="monospace" font-size="7" fill="#52525b" text-anchor="middle">&#916;v = -0.68 m/s</text>

  <!-- Primary Evacuation Staircase -->
  <g transform="translate(485, 160)">
    <rect width="40" height="74" fill="#faf9f6" stroke="#111111" stroke-width="1.4" />
    <line x1="0" y1="15" x2="40" y2="15" stroke="#71717a" stroke-width="0.8" />
    <line x1="0" y1="30" x2="40" y2="30" stroke="#71717a" stroke-width="0.8" />
    <line x1="0" y1="45" x2="40" y2="45" stroke="#71717a" stroke-width="0.8" />
    <line x1="0" y1="60" x2="40" y2="60" stroke="#71717a" stroke-width="0.8" />
    <text x="20" y="69" font-family="monospace" font-size="6.5" font-weight="700" fill="#111111" text-anchor="middle">STAIR</text>
  </g>

  <!-- Egress Flow Vectors -->
  <path d="M 150 110 Q 240 130 285 170 T 430 195 L 484 195" fill="none" stroke="#991b1b" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#feArrowInk)" />
  <path d="M 360 110 Q 380 145 440 185 L 484 185" fill="none" stroke="#52525b" stroke-width="1.2" stroke-dasharray="3 2" marker-end="url(#feArrowGraphite)" />
  <path d="M 130 290 Q 200 270 250 220 T 435 205 L 484 205" fill="none" stroke="#991b1b" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#feArrowInk)" />
  <path d="M 320 290 Q 350 255 425 215 L 484 210" fill="none" stroke="#52525b" stroke-width="1.2" stroke-dasharray="3 2" marker-end="url(#feArrowGraphite)" />
  <path d="M 100 195 L 418 195" fill="none" stroke="#991b1b" stroke-width="1.6" marker-end="url(#feArrowInk)" opacity="0.85" />

  <!-- Agent Node Markers -->
  <circle cx="150" cy="110" r="2.8" fill="#ffffff" stroke="#991b1b" stroke-width="1.4" />
  <circle cx="220" cy="125" r="2.8" fill="#ffffff" stroke="#991b1b" stroke-width="1.4" />
  <circle cx="285" cy="170" r="3.2" fill="#991b1b" />
  <circle cx="350" cy="185" r="3.5" fill="#991b1b" />
  <circle cx="410" cy="192" r="3.8" fill="#7f1d1d" />
  <circle cx="130" cy="290" r="2.8" fill="#ffffff" stroke="#52525b" stroke-width="1.4" />

  <!-- Sharp Architectural Title Block -->
  <rect x="158" y="324" width="284" height="42" fill="#ffffff" stroke="#111111" stroke-width="1.2" />
  <rect x="158" y="324" width="4" height="42" fill="#991b1b" />
  <text x="174" y="342" font-family="'Space Grotesk', system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#111111" letter-spacing="1">12 &#8212; FIRE ESCAPE SIMULATION</text>
  <text x="174" y="357" font-family="monospace" font-size="8" font-weight="600" fill="#52525b" letter-spacing="0.6">WORK IN PROGRESS &#8226; COMPUTATIONAL EGRESS</text>
</svg>
