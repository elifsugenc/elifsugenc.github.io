<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <!-- Technical Blueprint Grid Pattern -->
    <pattern id="feGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e2e8f0" stroke-width="0.8"/>
    </pattern>
    <pattern id="feFineGrid" width="5" height="5" patternUnits="userSpaceOnUse">
      <path d="M 5 0 L 0 0 0 5" fill="none" stroke="#f1f5f9" stroke-width="0.4"/>
    </pattern>
    
    <!-- Linear Gradient for Panic Heatmap -->
    <linearGradient id="feHeatGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fee2e2" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#fca5a5" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Marker Arrow for Egress Trajectories -->
    <marker id="feArrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M 0 0 L 6 3 L 0 6 z" fill="#ef4444" />
    </marker>
    <marker id="feArrowOrange" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M 0 0 L 6 3 L 0 6 z" fill="#f97316" />
    </marker>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="600" height="400" fill="#f8fafc" />
  <rect width="600" height="400" fill="url(#feFineGrid)" />
  <rect width="600" height="400" fill="url(#feGrid)" />

  <!-- Sheet Corner Registration Marks -->
  <path d="M 16 28 L 16 16 L 28 16" fill="none" stroke="#94a3b8" stroke-width="1.2" />
  <path d="M 584 28 L 584 16 L 572 16" fill="none" stroke="#94a3b8" stroke-width="1.2" />
  <path d="M 16 372 L 16 384 L 28 384" fill="none" stroke="#94a3b8" stroke-width="1.2" />
  <path d="M 584 372 L 584 384 L 572 384" fill="none" stroke="#94a3b8" stroke-width="1.2" />

  <!-- Drafting Coordinates & Scale Header -->
  <text x="32" y="32" font-family="monospace" font-size="9" font-weight="700" fill="#ef4444" letter-spacing="1.5">FIG. 12 &bull; AGENT-BASED EGRESS SIMULATION // SPATIAL PANIC DYNAMICS</text>
  <text x="568" y="32" font-family="monospace" font-size="9" font-weight="700" fill="#94a3b8" text-anchor="end" letter-spacing="1">MEF UNIVERSITY &bull; 2027</text>

  <!-- Floor Plan Walls (Section Cut - Deep Charcoal Navy) -->
  <!-- Outer Boundary Perimeter -->
  <rect x="70" y="60" width="460" height="280" fill="none" stroke="#0f172a" stroke-width="2.5" />
  
  <!-- Interior Spatial Enclosures / Corridors -->
  <!-- Upper Rooms / Studios -->
  <line x1="70" y1="150" x2="260" y2="150" stroke="#0f172a" stroke-width="2" />
  <line x1="310" y1="150" x2="530" y2="150" stroke="#0f172a" stroke-width="2" />
  <line x1="260" y1="60" x2="260" y2="150" stroke="#0f172a" stroke-width="2" />
  <line x1="410" y1="60" x2="410" y2="150" stroke="#0f172a" stroke-width="2" />

  <!-- Lower Rooms / Lab Core -->
  <line x1="70" y1="240" x2="220" y2="240" stroke="#0f172a" stroke-width="2" />
  <line x1="280" y1="240" x2="430" y2="240" stroke="#0f172a" stroke-width="2" />
  <line x1="220" y1="240" x2="220" y2="340" stroke="#0f172a" stroke-width="2" />
  <line x1="370" y1="240" x2="370" y2="340" stroke="#0f172a" stroke-width="2" />

  <!-- Central Egress Spine / Hallway -->
  <!-- Doorway Openings (Gaps in walls) -->
  <circle cx="285" cy="150" r="14" fill="none" stroke="#ef4444" stroke-width="0.8" stroke-dasharray="2 2" />
  <circle cx="250" cy="240" r="14" fill="none" stroke="#ef4444" stroke-width="0.8" stroke-dasharray="2 2" />

  <!-- Panic Congestion Heatmap Zone at Egress Funnel -->
  <rect x="420" y="160" width="105" height="75" fill="url(#feHeatGrad)" rx="4" />
  <rect x="420" y="160" width="105" height="75" fill="none" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="4 3" />
  <text x="472" y="180" font-family="monospace" font-size="8" font-weight="700" fill="#dc2626" text-anchor="middle" letter-spacing="1">BOTTLENECK</text>
  <text x="472" y="195" font-family="monospace" font-size="7.5" fill="#ef4444" text-anchor="middle">EGRESS THRESHOLD</text>
  <text x="472" y="210" font-family="monospace" font-size="7" fill="#7f1d1d" text-anchor="middle">&Delta;v = -0.68 m/s</text>

  <!-- Primary Evacuation Staircase (Right End) -->
  <g transform="translate(485, 160)">
    <rect width="40" height="75" fill="#f1f5f9" stroke="#0f172a" stroke-width="1.8" />
    <line x1="0" y1="15" x2="40" y2="15" stroke="#94a3b8" stroke-width="1" />
    <line x1="0" y1="30" x2="40" y2="30" stroke="#94a3b8" stroke-width="1" />
    <line x1="0" y1="45" x2="40" y2="45" stroke="#94a3b8" stroke-width="1" />
    <line x1="0" y1="60" x2="40" y2="60" stroke="#94a3b8" stroke-width="1" />
    <text x="20" y="70" font-family="monospace" font-size="7" font-weight="700" fill="#0f172a" text-anchor="middle">STAIR</text>
  </g>

  <!-- Agent Evacuation Trajectories (Computational Streamlines) -->
  <!-- Path 1 (From Upper-Left Room) -->
  <path d="M 150 110 Q 240 130 285 170 T 430 195 L 485 195" fill="none" stroke="#ef4444" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#feArrow)" />
  <!-- Path 2 (From Upper-Right Studio) -->
  <path d="M 360 110 Q 380 145 440 185 L 485 185" fill="none" stroke="#f97316" stroke-width="1.5" stroke-dasharray="4 2" marker-end="url(#feArrowOrange)" />
  <!-- Path 3 (From Lower Corridor) -->
  <path d="M 130 290 Q 200 270 250 220 T 435 205 L 485 205" fill="none" stroke="#ef4444" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#feArrow)" />
  <!-- Path 4 (From Lower-Right Lab) -->
  <path d="M 320 290 Q 350 255 425 215 L 485 210" fill="none" stroke="#f97316" stroke-width="1.5" stroke-dasharray="4 2" marker-end="url(#feArrowOrange)" />
  <!-- Central High-Velocity Flow -->
  <path d="M 100 195 L 420 195" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#feArrow)" opacity="0.8" />

  <!-- Agent Particles (Circles along corridors) -->
  <circle cx="150" cy="110" r="3.5" fill="#ef4444" />
  <circle cx="220" cy="125" r="3.5" fill="#ef4444" />
  <circle cx="285" cy="170" r="4" fill="#dc2626" />
  <circle cx="350" cy="185" r="4.5" fill="#b91c1c" />
  <circle cx="410" cy="192" r="5" fill="#991b1b" />
  <circle cx="445" cy="195" r="5" fill="#7f1d1d" />
  <circle cx="130" cy="290" r="3.5" fill="#f97316" />
  <circle cx="320" cy="290" r="3.5" fill="#f97316" />
  <circle cx="250" cy="220" r="4" fill="#ea580c" />
  <circle cx="360" cy="110" r="3.5" fill="#f97316" />

  <!-- Dimensional Witness Lines & Labels -->
  <line x1="70" y1="355" x2="530" y2="355" stroke="#94a3b8" stroke-width="0.8" />
  <line x1="70" y1="350" x2="70" y2="360" stroke="#94a3b8" stroke-width="0.8" />
  <line x1="530" y1="350" x2="530" y2="360" stroke="#94a3b8" stroke-width="0.8" />
  <text x="300" y="367" font-family="monospace" font-size="8" fill="#64748b" text-anchor="middle" letter-spacing="1">BUILDING COMPLEX &bull; CLEAR SPAN 46.0M</text>

  <!-- Technical Annotation Box -->
  <rect x="80" y="72" width="165" height="42" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="3" opacity="0.95" />
  <text x="90" y="87" font-family="monospace" font-size="8" font-weight="700" fill="#0f172a">EGRESS DYNAMICS &bull; 2027</text>
  <text x="90" y="100" font-family="monospace" font-size="7" fill="#64748b">AGENT COUNT: N=250 OCCUPANTS</text>
  <text x="90" y="109" font-family="monospace" font-size="7" fill="#ef4444">EVACUATION T_CLEAR: 142s</text>
</svg>
