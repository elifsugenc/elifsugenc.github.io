<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <!-- Technical Blueprint Grid Pattern -->
    <pattern id="emGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e2e8f0" stroke-width="0.8"/>
    </pattern>
    <pattern id="emFineGrid" width="5" height="5" patternUnits="userSpaceOnUse">
      <path d="M 5 0 L 0 0 0 5" fill="none" stroke="#f1f5f9" stroke-width="0.4"/>
    </pattern>
    
    <!-- Linear Gradients for Architectural Shading -->
    <linearGradient id="emTerraceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="emWallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="600" height="400" fill="#f8fafc" />
  <rect width="600" height="400" fill="url(#emFineGrid)" />
  <rect width="600" height="400" fill="url(#emGrid)" />

  <!-- Sheet Corner Registration Marks -->
  <path d="M 16 28 L 16 16 L 28 16" fill="none" stroke="#94a3b8" stroke-width="1.2" />
  <path d="M 584 28 L 584 16 L 572 16" fill="none" stroke="#94a3b8" stroke-width="1.2" />
  <path d="M 16 372 L 16 384 L 28 384" fill="none" stroke="#94a3b8" stroke-width="1.2" />
  <path d="M 584 372 L 584 384 L 572 384" fill="none" stroke="#94a3b8" stroke-width="1.2" />

  <!-- Drafting Coordinates & Scale Header -->
  <text x="32" y="32" font-family="monospace" font-size="9" font-weight="700" fill="#64748b" letter-spacing="1.5">FIG. 01 &bull; AXONOMETRIC CONCEPT // MONUMENT OF INVISIBLE LABOR</text>
  <text x="568" y="32" font-family="monospace" font-size="9" font-weight="700" fill="#94a3b8" text-anchor="end" letter-spacing="1">SCALE 1:250</text>

  <!-- Ground Plane Horizon & Grid Axis -->
  <line x1="40" y1="280" x2="560" y2="280" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="6 4" />
  <line x1="300" y1="50" x2="300" y2="350" stroke="#e2e8f0" stroke-width="0.8" stroke-dasharray="3 3" />

  <!-- Stepped Counter-Monument Terraces (Axonometric Projections) -->
  <!-- Base Terrace Foundation -->
  <polygon points="120,290 300,345 480,290 300,235" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2" />
  <polygon points="120,290 300,345 300,360 120,305" fill="#cbd5e1" stroke="#64748b" stroke-width="1.2" />
  <polygon points="300,345 480,290 480,305 300,360" fill="#94a3b8" stroke="#64748b" stroke-width="1.2" />

  <!-- Second Tier Stepped Terrace (Living Archive Chamber) -->
  <polygon points="160,265 300,308 440,265 300,222" fill="#ffffff" stroke="#475569" stroke-width="1.5" />
  <polygon points="160,265 300,308 300,318 160,275" fill="#cbd5e1" stroke="#475569" stroke-width="1.2" />
  <polygon points="300,308 440,265 440,275 300,318" fill="#94a3b8" stroke="#475569" stroke-width="1.2" />

  <!-- Third Tier Cantilevered Memorial Platform -->
  <polygon points="200,240 300,270 400,240 300,210" fill="#f1f5f9" stroke="#1e293b" stroke-width="1.5" />

  <!-- Vertical Memorial Pylons / Labor Timeline Monoliths -->
  <!-- Pylon 1 (Left Wing) -->
  <polygon points="210,130 226,125 226,228 210,233" fill="#3b82f6" opacity="0.85" stroke="#1d4ed8" stroke-width="1" />
  <polygon points="226,125 240,129 240,232 226,228" fill="#1d4ed8" stroke="#1e40af" stroke-width="1" />
  <polygon points="210,130 226,125 240,129 224,134" fill="#60a5fa" stroke="#1d4ed8" stroke-width="1" />

  <!-- Pylon 2 (Center Monolith - The Empty Hour) -->
  <polygon points="288,85 312,78 312,250 288,258" fill="#0f172a" stroke="#020617" stroke-width="1.2" />
  <polygon points="312,78 332,84 332,256 312,250" fill="#1e293b" stroke="#020617" stroke-width="1.2" />
  <polygon points="288,85 312,78 332,84 308,91" fill="#475569" stroke="#020617" stroke-width="1.2" />

  <!-- Pylon 3 (Right Wing) -->
  <polygon points="370,140 386,135 386,234 370,239" fill="#3b82f6" opacity="0.85" stroke="#1d4ed8" stroke-width="1" />
  <polygon points="386,135 400,139 400,238 386,234" fill="#1d4ed8" stroke="#1e40af" stroke-width="1" />
  <polygon points="370,140 386,135 400,139 384,144" fill="#60a5fa" stroke="#1d4ed8" stroke-width="1" />

  <!-- Glass Light Canopy Membrane / Suspended Tensile Wires -->
  <line x1="226" y1="125" x2="312" y2="78" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="3 3" />
  <line x1="312" y1="78" x2="386" y2="135" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="3 3" />
  <line x1="288" y1="85" x2="200" y2="240" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="2 3" />
  <line x1="332" y1="84" x2="400" y2="240" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="2 3" />

  <!-- Architectural Compass & North Arrow (Bottom-Left) -->
  <g transform="translate(65, 335)">
    <circle cx="0" cy="0" r="16" fill="none" stroke="#cbd5e1" stroke-width="1" />
    <polygon points="0,-14 4,0 0,2 -4,0" fill="#2563eb" />
    <polygon points="0,14 4,0 0,-2 -4,0" fill="#cbd5e1" />
    <text x="0" y="-18" font-family="monospace" font-size="8" font-weight="700" fill="#2563eb" text-anchor="middle">N</text>
  </g>

  <!-- Technical Annotation Dimension Lines -->
  <line x1="495" y1="78" x2="495" y2="345" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="2 2" />
  <line x1="490" y1="78" x2="500" y2="78" stroke="#94a3b8" stroke-width="1" />
  <line x1="490" y1="345" x2="500" y2="345" stroke="#94a3b8" stroke-width="1" />
  <text x="510" y="215" font-family="monospace" font-size="8" font-weight="700" fill="#64748b" transform="rotate(90, 510, 215)">H = +24.50m (CIVIC SPAN)</text>

  <!-- Center Label Plaque with Architectural Identity -->
  <rect x="180" y="325" width="240" height="42" rx="4" fill="#ffffff" stroke="#0f172a" stroke-width="1.8" filter="drop-shadow(0 2px 8px rgba(15,23,42,0.08))" />
  <rect x="180" y="325" width="6" height="42" fill="#2563eb" rx="2" />
  <text x="198" y="343" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13" font-weight="800" fill="#0f172a" letter-spacing="1">01 &mdash; EMEK MUSEUM</text>
  <text x="198" y="358" font-family="monospace" font-size="8.5" font-weight="600" fill="#64748b" letter-spacing="0.5">COUNTER-MONUMENT &bull; LIVING ARCHIVE</text>
</svg>
