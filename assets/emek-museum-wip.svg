<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <pattern id="emGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#eceae4" stroke-width="0.6"/>
    </pattern>
  </defs>

  <!-- Warm Drafting Paper Surface -->
  <rect width="600" height="600" fill="#faf9f6" />
  <rect width="600" height="600" fill="url(#emGrid)" />

  <!-- Sheet Border & Hairline Corner Marks -->
  <rect x="24" y="24" width="552" height="552" fill="none" stroke="#d4d2cb" stroke-width="0.8" />
  <path d="M 24 44 L 24 24 L 44 24 M 576 44 L 576 24 L 556 24 M 24 556 L 24 576 L 44 576 M 576 556 L 576 576 L 556 576" fill="none" stroke="#71717a" stroke-width="1" />

  <!-- Subtle Center Reticle -->
  <circle cx="300" cy="300" r="180" fill="none" stroke="#e4e2db" stroke-width="0.8" stroke-dasharray="3 3" />
  <line x1="300" y1="90" x2="300" y2="510" stroke="#eceae4" stroke-width="0.8" />
  <line x1="90" y1="300" x2="510" y2="300" stroke="#eceae4" stroke-width="0.8" />

  <!-- Clean Center Plate: Sadece WORK IN PROGRESS -->
  <text x="300" y="286" font-family="'Space Grotesk', system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" letter-spacing="4" fill="#111111" text-anchor="middle">WORK IN</text>
  <text x="300" y="326" font-family="'Space Grotesk', system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" letter-spacing="4" fill="#1a365d" text-anchor="middle">PROGRESS</text>
</svg>
