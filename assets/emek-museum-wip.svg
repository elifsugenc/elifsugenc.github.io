<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <pattern id="emGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#eceae4" stroke-width="0.6"/>
    </pattern>
  </defs>

  <!-- Warm Drafting Paper Surface -->
  <rect width="600" height="400" fill="#faf9f6" />
  <rect width="600" height="400" fill="url(#emGrid)" />

  <!-- Sheet Border & Crop Marks -->
  <rect x="16" y="16" width="568" height="368" fill="none" stroke="#d4d2cb" stroke-width="0.8" />
  <path d="M 16 28 L 16 16 L 28 16 M 584 28 L 584 16 L 572 16 M 16 372 L 16 384 L 28 384 M 584 372 L 584 384 L 572 384" fill="none" stroke="#71717a" stroke-width="1" />

  <!-- Drafting Coordinates & Scale Header (centered inside 1:1 square safe zone x=116..484) -->
  <text x="116" y="34" font-family="monospace" font-size="8.5" font-weight="600" fill="#52525b" letter-spacing="1.2">FIG. 01 &#8226; AXONOMETRIC STUDY</text>
  <text x="484" y="34" font-family="monospace" font-size="8.5" font-weight="600" fill="#71717a" text-anchor="end" letter-spacing="1">SCALE 1:250</text>

  <!-- Datum Horizon & Vertical Axis -->
  <line x1="40" y1="278" x2="560" y2="278" stroke="#c7c5bd" stroke-width="0.8" stroke-dasharray="5 4" />
  <line x1="300" y1="52" x2="300" y2="340" stroke="#e2e0d8" stroke-width="0.7" stroke-dasharray="2 3" />

  <!-- Stepped Counter-Monument Terraces (Wireframe & Restrained Tone) -->
  <!-- Base Terrace Foundation -->
  <polygon points="120,288 300,342 480,288 300,234" fill="#f3f2ed" stroke="#71717a" stroke-width="1" />
  <polygon points="120,288 300,342 300,356 120,302" fill="#e6e4dd" stroke="#71717a" stroke-width="1" />
  <polygon points="300,342 480,288 480,302 300,356" fill="#d6d3cb" stroke="#71717a" stroke-width="1" />

  <!-- Second Tier Stepped Terrace -->
  <polygon points="160,263 300,305 440,263 300,221" fill="#ffffff" stroke="#3f3f46" stroke-width="1.2" />
  <polygon points="160,263 300,305 300,315 160,273" fill="#e6e4dd" stroke="#3f3f46" stroke-width="1" />
  <polygon points="300,305 440,263 440,273 300,315" fill="#d6d3cb" stroke="#3f3f46" stroke-width="1" />

  <!-- Third Tier Cantilevered Platform -->
  <polygon points="200,238 300,268 400,238 300,208" fill="#faf9f6" stroke="#111111" stroke-width="1.2" />

  <!-- Vertical Memorial Pylons -->
  <!-- Pylon 1 (Left Wing) -->
  <polygon points="210,130 226,125 226,227 210,232" fill="#e2e8f0" stroke="#1a365d" stroke-width="1.1" />
  <polygon points="226,125 240,129 240,231 226,227" fill="#cbd5e1" stroke="#1a365d" stroke-width="1.1" />
  <polygon points="210,130 226,125 240,129 224,134" fill="#ffffff" stroke="#1a365d" stroke-width="1.1" />

  <!-- Pylon 2 (Center Monolith - The Empty Hour) -->
  <polygon points="288,84 312,77 312,249 288,257" fill="#18181b" stroke="#111111" stroke-width="1.1" />
  <polygon points="312,77 332,83 332,255 312,249" fill="#27272a" stroke="#111111" stroke-width="1.1" />
  <polygon points="288,84 312,77 332,83 308,90" fill="#52525b" stroke="#111111" stroke-width="1.1" />

  <!-- Pylon 3 (Right Wing) -->
  <polygon points="370,140 386,135 386,233 370,238" fill="#e2e8f0" stroke="#1a365d" stroke-width="1.1" />
  <polygon points="386,135 400,139 400,237 386,233" fill="#cbd5e1" stroke="#1a365d" stroke-width="1.1" />
  <polygon points="370,140 386,135 400,139 384,144" fill="#ffffff" stroke="#1a365d" stroke-width="1.1" />

  <!-- Suspended Tensile Lines -->
  <line x1="226" y1="125" x2="312" y2="77" stroke="#1a365d" stroke-width="1" stroke-dasharray="3 3" />
  <line x1="312" y1="77" x2="386" y2="135" stroke="#1a365d" stroke-width="1" stroke-dasharray="3 3" />
  <line x1="288" y1="84" x2="200" y2="238" stroke="#a1a1aa" stroke-width="0.7" stroke-dasharray="2 3" />
  <line x1="332" y1="83" x2="400" y2="238" stroke="#a1a1aa" stroke-width="0.7" stroke-dasharray="2 3" />

  <!-- Architectural North Marker -->
  <g transform="translate(60, 336)">
    <circle cx="0" cy="0" r="14" fill="none" stroke="#a1a1aa" stroke-width="0.8" />
    <line x1="0" y1="-17" x2="0" y2="17" stroke="#a1a1aa" stroke-width="0.6" />
    <line x1="-17" y1="0" x2="17" y2="0" stroke="#a1a1aa" stroke-width="0.6" />
    <polygon points="0,-12 3.5,0 0,-2 -3.5,0" fill="#111111" />
    <text x="0" y="-19" font-family="monospace" font-size="7.5" font-weight="700" fill="#111111" text-anchor="middle">N</text>
  </g>

  <!-- Technical Dimension Line -->
  <line x1="498" y1="77" x2="498" y2="342" stroke="#a1a1aa" stroke-width="0.8" stroke-dasharray="2 2" />
  <line x1="493" y1="77" x2="503" y2="77" stroke="#71717a" stroke-width="1" />
  <line x1="493" y1="342" x2="503" y2="342" stroke="#71717a" stroke-width="1" />
  <text x="513" y="214" font-family="monospace" font-size="8" font-weight="600" fill="#52525b" transform="rotate(90, 513, 214)">H = +24.50m (CIVIC SPAN)</text>

  <!-- Sharp Architectural Title Block (Zero Shadow, Zero Rounded Pill) -->
  <rect x="176" y="324" width="248" height="42" fill="#ffffff" stroke="#111111" stroke-width="1.2" />
  <rect x="176" y="324" width="4" height="42" fill="#1a365d" />
  <text x="192" y="342" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" font-weight="700" fill="#111111" letter-spacing="1.2">01 &#8212; EMEK MUSEUM</text>
  <text x="192" y="357" font-family="monospace" font-size="8" font-weight="600" fill="#52525b" letter-spacing="0.6">WORK IN PROGRESS &#8226; LIVING ARCHIVE</text>
</svg>
