<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="600" height="600">
  <!-- Clean architectural drafting canvas -->
  <rect width="300" height="300" fill="#f8fafc"/>

  <!-- Blueprint grid -->
  <defs>
    <pattern id="grid" width="15" height="15" patternUnits="userSpaceOnUse">
      <path d="M 15 0 L 0 0 0 15" fill="none" stroke="#e2e8f0" stroke-width="0.8"/>
    </pattern>
  </defs>
  <rect width="300" height="300" fill="url(#grid)"/>

  <!-- Drafting concentric circles & crosshairs -->
  <circle cx="150" cy="150" r="135" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="150" cy="150" r="142" fill="none" stroke="#64748b" stroke-width="1"/>
  <line x1="150" y1="8" x2="150" y2="292" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="3 3"/>
  <line x1="8" y1="150" x2="292" y2="150" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="3 3"/>

  <!-- Center Status Plaque -->
  <rect x="25" y="86" width="250" height="128" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>

  <!-- Top accent bar -->
  <rect x="25" y="86" width="250" height="8" rx="4" fill="#2563eb"/>

  <!-- Main Headline Typography -->
  <text x="150" y="138" font-family="'Space Grotesk', system-ui, -apple-system, sans-serif" font-size="31" font-weight="900" letter-spacing="3" fill="#0f172a" text-anchor="middle">WORK IN</text>
  <text x="150" y="174" font-family="'Space Grotesk', system-ui, -apple-system, sans-serif" font-size="31" font-weight="900" letter-spacing="3" fill="#1d4ed8" text-anchor="middle">PROGRESS</text>

  <!-- Status pill at bottom -->
  <rect x="80" y="186" width="140" height="18" rx="3" fill="#0f172a"/>
  <text x="150" y="199" font-family="monospace, sans-serif" font-size="9" font-weight="700" letter-spacing="1.5" fill="#ffffff" text-anchor="middle">ONGOING &#8226; 2027</text>
</svg>
