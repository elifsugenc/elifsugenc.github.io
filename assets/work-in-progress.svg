<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="600" height="600">
  <defs>
    <pattern id="wipGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#eceae4" stroke-width="0.6"/>
    </pattern>
  </defs>
  <rect width="300" height="300" fill="#faf9f6"/>
  <rect width="300" height="300" fill="url(#wipGrid)"/>
  <rect x="12" y="12" width="276" height="276" fill="none" stroke="#d4d2cb" stroke-width="0.8"/>

  <!-- Fine Drafting Reticle -->
  <circle cx="150" cy="150" r="118" fill="none" stroke="#c7c5bd" stroke-width="0.8" stroke-dasharray="3 3"/>
  <line x1="150" y1="20" x2="150" y2="280" stroke="#d4d2cb" stroke-width="0.8" stroke-dasharray="2 3"/>
  <line x1="20" y1="150" x2="280" y2="150" stroke="#d4d2cb" stroke-width="0.8" stroke-dasharray="2 3"/>

  <!-- Architectural Spec Plate (Zero Rounded Pill) -->
  <rect x="34" y="96" width="232" height="108" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>
  <rect x="34" y="96" width="232" height="3" fill="#1a365d"/>

  <text x="150" y="138" font-family="'Space Grotesk', system-ui, sans-serif" font-size="25" font-weight="700" letter-spacing="2.5" fill="#111111" text-anchor="middle">WORK IN</text>
  <text x="150" y="168" font-family="'Space Grotesk', system-ui, sans-serif" font-size="25" font-weight="700" letter-spacing="2.5" fill="#1a365d" text-anchor="middle">PROGRESS</text>

  <line x1="88" y1="181" x2="212" y2="181" stroke="#e2e0d8" stroke-width="0.8"/>
  <text x="150" y="196" font-family="monospace" font-size="8.5" font-weight="600" letter-spacing="1.6" fill="#52525b" text-anchor="middle">ONGOING &#8226; ARCHIVE</text>
</svg>
