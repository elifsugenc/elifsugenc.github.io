<!DOCTYPE html>
<html>
<head>
<style>
.project-image {
    aspect-ratio: 1.25;
    background: #f1f1ee;
    display: grid;
    place-items: center;
    overflow: hidden;
    position: relative;
    width: 400px;
    font-family: system-ui, -apple-system, sans-serif;
}
.typo-poster {
    container-type: inline-size;
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    height: 100%;
    width: 100%;
    padding: 6cqw;
    box-sizing: border-box;
    text-transform: uppercase;
    color: #171717;
    line-height: 0.85;
}
.typo-poster > div {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
}
</style>
</head>
<body>
<div class="project-image">
<span style="position: absolute; font-size: 17rem; color: #3157d7; opacity: 0.15; line-height: 1; font-family: Georgia, serif; z-index: 1; font-style: normal; font-weight: normal; top: 50%; left: 50%; transform: translate(-50%, -50%);">?</span>
<div class="typo-poster">
    <div>
        <span style="font-weight: 800; font-size: 10cqw; letter-spacing: -0.04em;">HOW</span>
        <span style="font-weight: 600; font-size: 7cqw; letter-spacing: -0.02em;">TO</span>
        <span style="font-weight: 900; font-size: 14cqw; letter-spacing: -0.05em;">MAKE</span>
    </div>
    <div style="justify-content: center;">
        <span style="font-weight: 900; font-size: 17.5cqw; letter-spacing: -0.06em;">INVISIBLE</span>
    </div>
    <div style="justify-content: flex-start;">
        <span style="font-weight: 700; font-size: 13cqw; letter-spacing: -0.04em;">LABOR</span>
    </div>
    <div style="justify-content: flex-end;">
        <span style="font-weight: 900; font-size: 19cqw; letter-spacing: -0.06em;">VISIBLE</span>
    </div>
</div>
</div>
</body>
</html>
