<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>invisible in plain sight</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    
    <!-- Start Screen -->
    <div id="start-screen" class="overlay flex-center">
        <div class="content">
            <h1>invisible in plain sight</h1>
            <p class="warning">An abstract experience about sexual violence, silence, and responsibility. No graphic imagery.</p>
            <button id="start-btn">Enter</button>
        </div>
    </div>

    <!-- Main Canvas -->
    <canvas id="experience-canvas"></canvas>

    <!-- HUD Text at the top -->
    <div id="hud-top" class="overlay pointer-events-none" style="text-align: center; padding-top: 5vh; z-index: 20;">
        <p id="top-glitch-text" style="font-size: 1.5rem; color: #ffffff; letter-spacing: 1px; transition: all 0.2s; opacity: 0; text-shadow: 0 0 10px rgba(0,0,0,0.8);">
            they were 50 of them but there were actually noone.
        </p>
    </div>

    <!-- UI Overlay for interaction text (revealed quotes) -->
    <div id="quote-overlay" class="overlay pointer-events-none">
        <p id="quote-text"></p>
    </div>

    <!-- Intrusive Text Overlay (for 10 and 35 milestones) -->
    <div id="intrusive-overlay" class="overlay flex-center pointer-events-none" style="display: none;">
        <h2 id="intrusive-text"></h2>
    </div>

    <!-- Ending Screen -->
    <div id="end-screen" class="overlay flex-center pointer-events-none" style="opacity: 0; transition: opacity 3s ease;">
        <div class="content text-center">
            <h2 id="end-question">were you looking at them?</h2>
            <p id="end-subtext" style="opacity: 0; transition: opacity 2s ease; margin-top: 2rem;">or were they looking at you?</p>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
