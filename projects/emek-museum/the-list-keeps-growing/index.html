<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#050505">
    <title>Emek Museum — Name Archive</title>
    <link rel="stylesheet" href="./style.css?v=20261114-dark-17">
</head>
<body>
    <a class="archive-back" href="../" aria-label="Return to Emek Museum">
        <span class="archive-back-arrow" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false"><path d="M18 12H6m0 0 6-6m-6 6 6 6" /></svg>
        </span>
        <span class="archive-back-copy"><span>RETURN TO</span><strong>EMEK MUSEUM</strong></span>
    </a>
    <main aria-label="Name archive">
        <section id="archive-reading" class="archive-reading" aria-label="Memorial names, one at a time">
            <div id="archive-opening" class="archive-opening">The Never-Finished Archive</div>
            <ul id="name-list" aria-label="Memorial names"></ul>
            <aside id="reading-detail" class="memorial-detail" aria-live="polite" aria-atomic="true" aria-hidden="true">
                <p class="detail-kicker">MEMORIAL RECORD</p>
                <dl>
                    <div><dt>EVENT</dt><dd data-detail-field="event"></dd></div>
                    <div><dt>DATE OF DEATH</dt><dd data-detail-field="date"></dd></div>
                    <div><dt>AGE</dt><dd data-detail-field="age"></dd></div>
                    <div><dt>TIME</dt><dd data-detail-field="time"></dd></div>
                </dl>
                <div class="detail-sources">
                    <a data-detail-source="names" target="_blank" rel="noopener noreferrer">NAME SOURCE ↗</a>
                    <a data-detail-source="age" target="_blank" rel="noopener noreferrer" hidden>AGE SOURCE ↗</a>
                    <a data-detail-source="time" target="_blank" rel="noopener noreferrer">EVENT TIME ↗</a>
                </div>
            </aside>
        </section>
        <footer id="archive-end" class="archive-end" aria-live="polite"></footer>
        <section id="archive-mosaic" class="archive-mosaic" aria-label="Names arranged as a full-screen archive wall">
            <div id="archive-mosaic-stage" class="archive-mosaic-stage">
                <ul id="name-mosaic" aria-label="Memorial names wall" aria-hidden="true"></ul>
                <aside id="wall-detail" class="memorial-detail wall-detail" role="dialog" aria-label="Memorial record" aria-live="polite" aria-atomic="true" aria-hidden="true">
                    <button class="wall-detail-close" type="button" aria-label="Close memorial record">×</button>
                    <p class="detail-kicker">MEMORIAL RECORD</p>
                    <dl>
                        <div><dt>EVENT</dt><dd data-detail-field="event"></dd></div>
                        <div><dt>DATE OF DEATH</dt><dd data-detail-field="date"></dd></div>
                        <div><dt>AGE</dt><dd data-detail-field="age"></dd></div>
                        <div><dt>TIME</dt><dd data-detail-field="time"></dd></div>
                    </dl>
                    <div class="detail-sources">
                        <a data-detail-source="names" target="_blank" rel="noopener noreferrer">NAME SOURCE ↗</a>
                        <a data-detail-source="age" target="_blank" rel="noopener noreferrer" hidden>AGE SOURCE ↗</a>
                        <a data-detail-source="time" target="_blank" rel="noopener noreferrer">EVENT TIME ↗</a>
                    </div>
                </aside>
            </div>
        </section>
    </main>
    <script src="./archive.js?v=20261114-names-19" defer></script>
</body>
</html>
